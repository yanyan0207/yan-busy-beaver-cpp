repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy
        types: [python]
        files: ^scripts/.*\.py$

      - id: pylint
        name: pylint
        language: system
        entry: uv run pylint
        types: [python]
        files: ^scripts/.*\.py$

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        language: system
        entry: clang-tidy
        args:
          - --config-file=.clang-tidy
          - -p=build
        types_or: [c, c++]
        files: ^(src|tests)/.*\.(cpp|hpp|h)$
